# edu-config/update.conf — 모든 실습 PC 의 업데이트 링크 (중앙 링크 파일)
#
#   여기를 고쳐 GitHub 에 push 하면, 각 PC 가 다음에 업데이트 스크립트(110 · 120 · 150 · 160)를
#   실행할 때 이 값을 쓴다. PC 에서 따로 할 일은 없다. (raw.githubusercontent.com 캐시 때문에 최대 5분쯤 늦을 수 있다)
#
#   ⚠ 이 파일은 실행되지 않고 값만 읽힌다 (/data/shell/linkconf.py 가 검사).
#     - 쓸 수 있는 이름 : GIT_BASE · CONTENTS · HF_DATA · HF_ENDPOINT · ENV_REPO · ENV_BRANCH · SLOT_1x0
#     - 값에 $ · ` 는 못 쓴다.  형식이 틀리면 PC 들은 이 파일을 무시하고 마지막으로 받은 사본을 쓴다
#     - 고친 뒤 이 PC 에서 미리 검사 :  python3 /data/shell/linkconf.py update.conf

# Git 저장소 칸에 상대 이름(예 edu-env.git)을 쓰면 앞에 붙는 주소
GIT_BASE="https://github.com/eycho913"

# 교육 콘텐츠 (Git) — "이름 | 저장소 | 브랜치·태그 | 보존 경로"
#   보존 경로 : 쉼표 구분.  경로 = 건드리지 않음(HF 데이터 등) · +경로 = 추가·갱신만, 이 PC 파일은 지우지 않음
#   저장소 칸을 비우면 그 콘텐츠는 업데이트하지 않는다
#   edu_isaac 의 logs · outputs : Isaac Lab 학습 결과가 쌓이는 자리 — 업데이트가 지우지 않게 미리 보존
CONTENTS=(
  "edu_base   | https://github.com/eycho913/edu_base.git   | main | models,golden/so101_golden"
  "edu_legacy | https://github.com/eycho913/edu_legacy.git | main | +motions"
  "edu_isaac  | https://github.com/eycho913/edu_isaac.git  | main | logs,outputs"
)

# 예비 번호 — 1x0_update-slot.sh 가 받을 콘텐츠 이름 (CONTENTS 의 이름). 빈칸 = 배정 없음
#   새 교육 코드 : CONTENTS 에 한 줄 + 여기 번호에 그 이름 → push 하면 모든 PC 에서 bash /data/shell/<번호>_update-slot.sh
SLOT_140=""
SLOT_170=""
SLOT_180=""
SLOT_190=""

# Hugging Face 데이터 — "콘텐츠 | model·dataset | repo_id | 받을 위치(콘텐츠 폴더 기준) | revision"
HF_ENDPOINT="https://huggingface.co"
HF_DATA=(
  "edu_base | model   | eycho96/so101_edu_models | models              | main"
  "edu_base | dataset | eycho96/so101_golden     | golden/so101_golden | main"
)

# 개발환경 기준값 저장소 (/data/setup) — 비우면 160_env-update.sh update 는 PC 기준값만 다시 적용
ENV_REPO=""
ENV_BRANCH="main"
